services:
  - type: web
    name: signal-quality-lookup
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --preload --timeout 300 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: SIGNAL_DATA_BASE
        value: /opt/render/project/src/data/TWM_MDT_City_25m
      - key: DATA_URL
        value: https://github.com/pin740922/signal-quality-lookup/releases/download/v1.0-demo/demo_data_4cities.zip
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONIOENCODING
        value: "utf-8"
      # ---- AI 智慧判讀（Gemini OpenAI 相容端點）----
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_MODEL
        value: gemini-2.5-flash
      # 金鑰為機密，不寫進版控；請在 Render 後台 Environment 填入其值
      - key: AI_API_KEY
        sync: false
