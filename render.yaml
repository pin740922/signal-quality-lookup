services:
  - type: web
    name: signal-quality-lookup
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --preload --timeout 300 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: SIGNAL_DATA_BASE
        value: /opt/render/project/src/data/TWM_MDT_City_25m
      - key: DATA_URL
        value: https://github.com/pin740922/signal-quality-lookup/releases/download/v1.0-demo/demo_data_3cities.zip
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONIOENCODING
        value: "utf-8"
